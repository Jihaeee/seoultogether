# Next.js 앱은 리포 루트가 아니라 frontend/ 안에 있다. base 를 지정하지 않으면
# Netlify 가 루트에서 package.json 을 못 찾아 빌드를 건너뛰고, 루트를 그대로
# 정적 퍼블리시한다 — index.html 이 없으니 결과는 404 다.
[build]
  base = "frontend"
  command = "npm run build"
  # publish 경로는 base 기준 상대경로다. output: "export" 산출물이 out/ 에 나온다.
  publish = "out"

[build.environment]
  # Next 16 은 Node 20.9+ 를 요구한다. Netlify 기본값에 맡기지 않고 고정한다.
  NODE_VERSION = "22"
